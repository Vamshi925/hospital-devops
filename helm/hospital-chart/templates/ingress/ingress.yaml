apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: hospital-ingress
  namespace: {{ .Values.namespace }}

  labels:
{{ include "hospital.labels" . | nindent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: api-gateway
                port:
                  number: 8081
