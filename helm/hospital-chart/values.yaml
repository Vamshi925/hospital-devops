databases:

  login:
    database: LoginService
    serviceName: mysql-login
    storage: 5Gi
    username: root
    password: root

  doctor:
    database: DoctorService
    serviceName: mysql-doctor
    storage: 5Gi
    username: root
    password: root

  appointment:
    database: AppointmentService
    serviceName: mysql-appointment
    storage: 5Gi
    username: root
    password: root

  medical-history:
    database: MedicalHistoryService
    serviceName: mysql-medical-history
    storage: 5Gi
    username: root
    password: root

  notification:
    database: NotificationService
    serviceName: mysql-notification
    storage: 5Gi
    username: root
    password: root

ingress:
  enabled: true
  className: nginx
  host: ""

frontend:
  replicaCount: 1

  image:
    repository: vamshi925/hospital-frontend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 20m
      memory: 32Mi

    limits:
      cpu: 300m
      memory: 256Mi
