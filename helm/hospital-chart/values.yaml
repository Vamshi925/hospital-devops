namespace: hospital

mysql:

  login:
    database: LoginService

  doctor:
    database: DoctorService

  appointment:
    database: AppointmentService

  medical-history:
    database: MedicalHistoryService

  notification:
    database: NotificationService

services:

  api-gateway:
    replicaCount: 1

    image:
      repository: vamshi925/api-gateway
      tag: latest
      pullPolicy: Always

    service:
      type: ClusterIP
      port: 8081

    configMap: api-gateway-config

    resources:
      requests:
        cpu: 25m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

    probes:
      startup:
        failureThreshold: 30
        periodSeconds: 10

      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10

      liveness:
        initialDelaySeconds: 60
        periodSeconds: 20

  eureka:
    replicaCount: 1

    image:
      repository: vamshi925/eureka-server
      tag: latest
      pullPolicy: Always

    service:
      type: ClusterIP
      port: 8761

    configMap: eureka-config

    resources:
      requests:
        cpu: 25m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

    probes:
      startup:
        failureThreshold: 30
        periodSeconds: 10

      readiness:
        initialDelaySeconds: 20
        periodSeconds: 10

      liveness:
        initialDelaySeconds: 40
        periodSeconds: 15

  login:
