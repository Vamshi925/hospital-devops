      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

    probes:
      startup:
        failureThreshold: 30
        periodSeconds: 10

      readiness:
        initialDelaySeconds: 20
        periodSeconds: 10

      liveness:
        initialDelaySeconds: 40
        periodSeconds: 15

  doctor:
