apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-medical-history
  namespace: hospital

spec:
  serviceName: mysql-medical-history

  replicas: 1

  selector:
    matchLabels:
      app: mysql-medical-history

  template:
    metadata:
      labels:
        app: mysql-medical-history

    spec:
      containers:
      - name: mysql

        image: mysql:8.4

        ports:
        - containerPort: 3306

        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-medical-history-secret
              key: MYSQL_ROOT_PASSWORD

        - name: MYSQL_DATABASE
          value: MedicalHistoryService

        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql

  volumeClaimTemplates:
  - metadata:
      name: mysql-storage

    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 5Gi
