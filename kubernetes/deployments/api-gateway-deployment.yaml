apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: vamshi925/api-gateway:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8081

        envFrom:
        - configMapRef:
            name: api-gateway-config

        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          failureThreshold: 60
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 20
